[tools]
rust = { version = "1.99.1", targets = "wasm32-unknown-unknown", components = "clippy,rustfmt" }
miniserve = "0.35.0"
watchexec = "2.8.0"

[tasks.run]
description = "Run the game natively"
run = "cargo run -p game --release"

[tasks.test]
description = "Run all unit tests"
run = "cargo test --workspace"

[tasks.fmt]
description = "Format all code"
run = "cargo fmt --all"

[tasks.lint]
description = "Check format and run clippy"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
]

[tasks."build:web"]
description = "Build the wasm bundle into dist/"
sources = ["crates/**/*.rs", "crates/**/Cargo.toml", "Cargo.*", "web/*"]
outputs = ["dist/game.wasm"]
run = [
  "cargo build -p game --release --target wasm32-unknown-unknown",
  "mkdir -p dist",
  "cp target/wasm32-unknown-unknown/release/game.wasm web/index.html web/mq_js_bundle.js dist/",
]

[tasks.serve]
description = "Build and serve the browser game on http://localhost:8080"
depends = ["build:web"]
run = "miniserve --index index.html --port 8080 dist"

[tasks.dev]
description = "Rebuild on change (run `serve` in a second terminal)"
run = "mise watch build:web"

[tasks.ci]
description = "Run lint, tests and the web build"
depends = ["lint", "test", "build:web"]

[tasks.build-all]
description = "Build every game in a subdirectory into its own dist/"
run = '''
set -e
for d in */; do
  [ -f "$d/mise.toml" ] && [ -f "$d/Cargo.toml" ] || continue
  echo "==> ${d%/}"
  (cd "$d" && mise run build)
done
'''

[tasks.site]
description = "Build every game and assemble the GitHub Pages site into site/"
depends = ["build:web", "build-all"]
run = "scripts/build-site.sh"
