[package]
name = "freight-siege"
version = "0.1.0"
description = "Freight Siege: a rail-network survivor-like"
edition = "2024"
license = "MIT"
publish = false

# Standalone workspace, independent of the repository root workspace.
[workspace]

[dependencies]
macroquad = { version = "=0.4.16", features = ["audio"] }
touch = { path = "../crates/touch" }

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev.package."*"]
opt-level = 2
